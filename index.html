<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#db2777" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Haushaltsbestand" />
  <title>Haushaltsbestand</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">Gemeinsamer Haushalt</div>
        <h1>Haushaltsbestand</h1>
      </div>
      <button id="logoutBtn" class="icon-btn hidden" type="button" aria-label="Abmelden">⎋</button>
    </header>

    <main id="main"></main>

    <nav id="bottomNav" class="bottom-nav hidden" aria-label="Hauptnavigation">
      <button data-tab="stock" class="nav-btn active" type="button">📦<span>Bestand</span></button>
      <button data-tab="shopping" class="nav-btn" type="button">🛒<span>Einkauf</span></button>
      <button data-tab="settings" class="nav-btn" type="button">⚙️<span>Haushalt</span></button>
    </nav>
  </div>

  <dialog id="categoryDialog">
    <form method="dialog" id="categoryForm" class="dialog-card">
      <h2>Kategorie hinzufügen</h2>
      <label>Name<input id="categoryName" maxlength="40" required placeholder="z. B. Katzen" /></label>
      <label>Emoji<input id="categoryIcon" maxlength="4" placeholder="🐱" /></label>
      <div class="dialog-actions">
        <button value="cancel" class="secondary-btn">Abbrechen</button>
        <button id="saveCategoryBtn" value="default" class="primary-btn">Speichern</button>
      </div>
    </form>
  </dialog>

  <dialog id="itemDialog">
    <form method="dialog" id="itemForm" class="dialog-card">
      <h2 id="itemDialogTitle">Artikel hinzufügen</h2>
      <input id="itemId" type="hidden" />
      <label>Name<input id="itemName" maxlength="80" required placeholder="z. B. Katzenfutter Huhn" /></label>
      <label>Kategorie<select id="itemCategory" required></select></label>
      <div class="form-grid">
        <label>Bestand<input id="itemQuantity" type="number" min="0" step="1" value="1" required /></label>
        <label>Mindestbestand<input id="itemMinimum" type="number" min="0" step="1" value="0" required /></label>
      </div>
      <label>Einheit<input id="itemUnit" maxlength="20" value="Stk." placeholder="Stk., Rollen, Dosen …" /></label>
      <div class="dialog-actions">
        <button value="cancel" class="secondary-btn">Abbrechen</button>
        <button id="saveItemBtn" value="default" class="primary-btn">Speichern</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script>
  <script src="app.js"></script>
</body>
</html>
